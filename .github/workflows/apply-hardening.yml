name: apply-hardening

on:
  push:
    branches: [fix/payment-recovery-hardening]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - name: Apply payment recovery hardening
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('apps/api/src/modules/payments/payments.service.ts')
          s = p.read_text()

          s = s.replace(
              "    if (payment.status !== 'PENDING') return payment; // duplicate delivery — no-op\n",
              """    if (payment.status === 'SUCCESS') {\n      // A successful payment may have settled immediately before a process\n      // crash or inventory race prevented order creation. Re-run the\n      // idempotent conversion on later webhook/poll deliveries.\n      await this.reconcileOrder(payment);\n      return payment;\n    }\n    if (payment.status !== 'PENDING') return payment; // terminal non-success\n"""
          )

          s = s.replace(
              """    if (payment.status === 'PENDING') {\n      const confirmed = await this.confirmFromProvider(reference);\n      return this.toSummary(confirmed ?? payment);\n    }\n    return this.toSummary(payment);\n""",
              """    if (payment.status === 'PENDING') {\n      const confirmed = await this.confirmFromProvider(reference);\n      return this.toSummary(confirmed ?? payment);\n    }\n    if (payment.status === 'SUCCESS') await this.reconcileOrder(payment);\n    return this.toSummary(payment);\n""",
              1,
          )

          marker = "  /** Paystack webhook entry point (public): signature-verified, then the standard confirm path. */"
          method = """  /** Best-effort durable convergence for SUCCESS payments that still lack an order. */\n  private async reconcileOrder(payment: Payment): Promise<void> {\n    try {\n      await this.orders.createFromPayment(payment, 'payment.reconcile');\n    } catch (error) {\n      this.logger.error(\n        `Order reconciliation failed for payment ${payment.reference}`,\n        error as Error,\n      );\n    }\n  }\n\n"""
          if method not in s:
              s = s.replace(marker, method + marker)

          old = """    if (payment.status === 'PENDING') {\n      const settled = await this.confirmFromProvider(reference);\n      if (settled) return settled;\n    }\n    if (payment.status !== 'SUCCESS') {\n"""
          new = """    if (payment.status === 'PENDING') {\n      const settled = await this.confirmFromProvider(reference);\n      if (settled) return settled;\n    }\n    if (payment.status === 'SUCCESS') {\n      await this.reconcileOrder(payment);\n      return payment;\n    }\n    if (payment.status !== 'SUCCESS') {\n"""
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('apps/api/src/integrations/payments/paystack.provider.ts')
          s = p.read_text()
          old = """    await this.request<PaystackEnvelope<unknown>>('POST', '/refund', {\n      transaction: tx.providerReference,\n      ...(input.amount !== undefined ? { amount: input.amount } : {}),\n    });\n"""
          new = """    // Paystack refunds are asynchronous. Before creating a new refund,\n    // reconcile any existing refund for this transaction. This closes the\n    // crash window where Paystack accepted the refund but our DB update did\n    // not complete, preventing a retry from issuing a second refund.\n    const existing = await this.request<PaystackEnvelope<Array<{ status?: string; amount?: number }>>>(\n      'GET',\n      `/refund?transaction=${encodeURIComponent(tx.providerReference)}&perPage=50`,\n    );\n    const alreadyRefunded = (existing.data ?? []).some((refund) =>\n      ['pending', 'processing', 'processed'].includes(refund.status ?? '') &&\n      (input.amount === undefined || refund.amount === undefined || refund.amount === input.amount),\n    );\n    if (!alreadyRefunded) {\n      await this.request<PaystackEnvelope<unknown>>('POST', '/refund', {\n        transaction: tx.providerReference,\n        ...(input.amount !== undefined ? { amount: input.amount } : {}),\n      });\n    }\n"""
          if old not in s:
              raise SystemExit('expected Paystack refund block not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Commit hardening changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/modules/payments/payments.service.ts apps/api/src/integrations/payments/paystack.provider.ts .github/workflows/apply-hardening.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix(payments): harden recovery and refund retries"
          git push

      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/apply-hardening.yml
          git commit -m "chore: remove temporary hardening workflow"
          git push
